name: Build today's game

on:
  schedule:
    - cron: '45 4 * * *'   # 06:45 Israel (winter) / 07:45 (summer); feeds are published ~03:40 local
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to build (YYYY-MM-DD, default today)'
        required: false
      force:
        description: 'Rebuild even if the day exists'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the day's game from live price feeds
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.date }}" ] && ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          python pipeline/build_day.py $ARGS
      - name: Commit and push
        run: |
          git config user.name "kamaze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data images
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%d) game"
          git push
